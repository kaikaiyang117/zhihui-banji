name: Build desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual release tag (for example v2.3.9)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: read

env:
  COS_BUCKET: zhihui-banji-update-1304673766
  COS_REGION: ap-chengdu
  COS_BASE_URL: https://zhihui-banji-update-1304673766.cos.ap-chengdu.myqcloud.com

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test and build Node server
        working-directory: server
        run: npm ci && npm run typecheck:server && npm run test:server && npm run build:server

  prepare_release:
    name: Prepare GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "美美大王工作台 $RELEASE_TAG" \
              --notes "安装包正在通过 GitHub Actions 构建。"
          fi

  build:
    name: Build ${{ matrix.artifact }}
    needs: [verify, prepare_release]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 仅发布 Apple Silicon arm64 安装包。
          - runner: windows-latest
            artifact: windows-x64
            platform: windows
          - runner: macos-15
            artifact: macos-arm64
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Windows Electron installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          REQUIRE_WINDOWS_SIGNING: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' && '1' || '0' }}
        run: .\packaging\build-windows.ps1

      - name: Smoke test Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $expected = $env:EXPECTED_VERSION -replace '^v', ''
          $installer = Get-ChildItem artifacts\*.exe | Select-Object -First 1
          if (-not $installer) { throw '未找到 Windows 安装包' }
          Write-Host "安装包：$($installer.Name)（$([math]::Round($installer.Length / 1MB, 1)) MB）"
          $versionFile = Get-ChildItem .\build\server-bundle\static\app-version.json -ErrorAction Stop
          $actual = (Get-Content $versionFile.FullName -Raw | ConvertFrom-Json).version
          if ($actual -ne $expected) {
            throw "版本号不一致：期望 $expected，实际 $actual"
          }
          .\packaging\test-windows-installer.ps1 -InstallerPath $installer.FullName

      - name: Configure macOS signing and notarization
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_P12_BASE64" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            echo 'REQUIRE_SIGNING=1' >> "$GITHUB_ENV"
            echo 'macOS 代码签名已启用。'
          else
            echo 'REQUIRE_SIGNING=0' >> "$GITHUB_ENV"
            echo '::warning::未配置完整 macOS 签名证书，将生成未签名安装包。'
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            echo 'REQUIRE_NOTARIZATION=1' >> "$GITHUB_ENV"
            echo 'macOS 公证已启用。'
          else
            echo 'REQUIRE_NOTARIZATION=0' >> "$GITHUB_ENV"
            echo '::warning::未配置完整 macOS 公证凭证，将跳过公证。'
          fi

      - name: Install desktop dependencies
        if: matrix.platform == 'macos'
        working-directory: desktop
        run: npm ci

      - name: Build macOS Electron installer
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./packaging/build-macos.sh "${{ matrix.arch }}"

      - name: Smoke test macOS package
        if: matrix.platform == 'macos'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          expected="${EXPECTED_VERSION#v}"
          dmg=$(ls artifacts/*.dmg | head -n 1)
          if [[ -z "$dmg" ]]; then echo '未找到 DMG 安装包'; exit 1; fi
          echo "安装包：$(basename "$dmg")"
          actual="$(node -p "require('./build/server-bundle/static/app-version.json').version")"
          if [[ "$actual" != "$expected" ]]; then
            echo "版本号不一致：期望 $expected，实际 $actual"
            exit 1
          fi
          spctl --assess --type execute --verbose "desktop/dist/mac/MeimeiWorkbench.app" 2>/dev/null && echo 'Gatekeeper 评估通过' || echo '未签名/未公证构建（预期行为）'

      - name: Upload build package to draft Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber

  release:
    name: Publish GitHub Release and COS mirror
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download platform packages from draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets
          rm -f release-assets/SHA256SUMS.txt release-assets/update-manifest.json

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create update manifest with COS primary URLs
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          UPDATE_BASE_URL: ${{ env.COS_BASE_URL }}/releases/${{ inputs.version || github.ref_name }}
        run: node "$GITHUB_WORKSPACE/packaging/create-update-manifest.mjs"

      - name: Prepare release notes
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "$WINDOWS_CERTIFICATE_BASE64" && -n "$WINDOWS_CERTIFICATE_PASSWORD" ]]; then
            windows_signing='已签名'
          else
            windows_signing='未签名（未配置证书）'
          fi
          if [[ -n "$APPLE_CERTIFICATE_P12_BASE64" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            macos_signing='已签名'
          else
            macos_signing='未签名（未配置证书）'
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            macos_notarization='已公证'
          else
            macos_notarization='未公证（未配置凭证）'
          fi
          cat > release-notes.md <<EOF
          本版本安装包已通过自动构建、版本号检查和 SHA-256 校验。

          下载源：
          - 腾讯云 COS（成都）：国内优先
          - GitHub Release：备用

          安全状态：
          - Windows：${windows_signing}
          - macOS：${macos_signing}，${macos_notarization}

          未签名安装包仅建议在可信环境中测试使用。配置对应 GitHub Actions Secrets 后，后续标签发布会自动启用签名和 macOS 公证。
          EOF

      - name: Install COSCMD
        run: |
          python -m pip install --upgrade pip
          python -m pip install coscmd

      - name: Configure COSCMD
        env:
          TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
        run: |
          test -n "$TENCENT_COS_SECRET_ID" || { echo '缺少 TENCENT_COS_SECRET_ID'; exit 1; }
          test -n "$TENCENT_COS_SECRET_KEY" || { echo '缺少 TENCENT_COS_SECRET_KEY'; exit 1; }
          coscmd config \
            -a "$TENCENT_COS_SECRET_ID" \
            -s "$TENCENT_COS_SECRET_KEY" \
            -b "$COS_BUCKET" \
            -r "$COS_REGION"

      - name: Upload immutable release files to COS
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          for file in release-assets/*; do
            name="$(basename "$file")"
            coscmd upload "$file" "releases/$RELEASE_TAG/$name"
          done

      - name: Verify COS release files are publicly readable
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          with open('release-assets/update-manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          for asset in manifest['assets']:
              url = asset['urls'][0]
              req = urllib.request.Request(url, method='HEAD')
              with urllib.request.urlopen(req, timeout=20) as response:
                  size = int(response.headers.get('Content-Length', '0'))
                  if response.status != 200:
                      raise RuntimeError(f'{url}: HTTP {response.status}')
                  if size and size != int(asset['size']):
                      raise RuntimeError(f'{url}: size {size} != {asset["size"]}')
                  print(f'COS OK: {asset["name"]} ({size or asset["size"]} bytes)')
          PY

      - name: Publish latest manifest to COS last
        run: |
          coscmd upload release-assets/update-manifest.json latest/update-manifest.json
          coscmd upload release-assets/SHA256SUMS.txt latest/SHA256SUMS.txt

      - name: Verify latest COS manifest
        run: |
          python - <<'PY'
          import json, urllib.request
          url = 'https://zhihui-banji-update-1304673766.cos.ap-chengdu.myqcloud.com/latest/update-manifest.json'
          with urllib.request.urlopen(url, timeout=20) as response:
              manifest = json.load(response)
          if not manifest.get('tag_name') or not manifest.get('assets'):
              raise RuntimeError('COS latest manifest 内容不完整')
          print('COS latest manifest:', manifest['tag_name'])
          PY

      - name: Upload checksums and update manifest to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            release-assets/SHA256SUMS.txt release-assets/update-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --title "美美大王工作台 $RELEASE_TAG" \
            --notes "$(cat release-notes.md)"
