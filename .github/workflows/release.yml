name: Build desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual build version (for example 0.3.0)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-x64
            platform: windows
          - runner: macos-15
            artifact: macos-arm64
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            artifact: macos-x64
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install packaging dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
        run: .\packaging\build-windows.ps1

      - name: Sign Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $installer = (Get-ChildItem artifacts\*.exe | Select-Object -First 1).FullName
          .\packaging\sign-windows.ps1 -InstallerPath $installer

      - name: Smoke test Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $expected = $env:EXPECTED_VERSION -replace '^v', ''
          $actual = & .\dist\MeimeiWorkbench\MeimeiWorkbench.exe --version
          if ($actual -notmatch [regex]::Escape($expected)) {
            throw "版本号不一致：期望 $expected，实际 $actual"
          }

      - name: Build macOS disk image
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
          REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          REQUIRE_NOTARIZATION: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./packaging/build-macos.sh "${{ matrix.arch }}"

      - name: Smoke test macOS package
        if: matrix.platform == 'macos'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          expected="${EXPECTED_VERSION#v}"
          actual="$(./dist/MeimeiWorkbench.app/Contents/MacOS/MeimeiWorkbench --version)"
          echo "$actual"
          grep -F "${expected}" <<< "$actual"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meimei-workbench-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create update manifest
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: python "$GITHUB_WORKSPACE/packaging/create-update-manifest.py"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "美美大王工作台 $GITHUB_REF_NAME" \
            --generate-notes
