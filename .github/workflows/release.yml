name: Build desktop releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual build version (for example 0.3.0)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: read

jobs:
  verify:
    name: Verify source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test and build Node server
        working-directory: server
        run: npm ci && npm run typecheck:server && npm run test:server && npm run build:server

  build:
    name: Build ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: windows-x64
            platform: windows
          - runner: macos-15
            artifact: macos-arm64
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            artifact: macos-x64
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json
            desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Build Windows Electron installer
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: .\packaging\build-windows.ps1

      - name: Smoke test Windows package
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $expected = $env:EXPECTED_VERSION -replace '^v', ''
          $installer = Get-ChildItem artifacts\*.exe | Select-Object -First 1
          if (-not $installer) { throw '未找到 Windows 安装包' }
          Write-Host "安装包：$($installer.Name)（$([math]::Round($installer.Length / 1MB, 1)) MB）"
          $versionFile = Get-ChildItem .\build\server-bundle\static\app-version.json -ErrorAction Stop
          $actual = (Get-Content $versionFile.FullName -Raw | ConvertFrom-Json).version
          if ($actual -ne $expected) {
            throw "版本号不一致：期望 $expected，实际 $actual"
          }

      - name: Configure macOS signing and notarization
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "$APPLE_CERTIFICATE_P12_BASE64" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            echo 'REQUIRE_SIGNING=1' >> "$GITHUB_ENV"
            echo 'macOS 代码签名已启用。'
          else
            echo 'REQUIRE_SIGNING=0' >> "$GITHUB_ENV"
            echo '::warning::未配置完整 macOS 签名证书，将生成未签名安装包。'
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            echo 'REQUIRE_NOTARIZATION=1' >> "$GITHUB_ENV"
            echo 'macOS 公证已启用。'
          else
            echo 'REQUIRE_NOTARIZATION=0' >> "$GITHUB_ENV"
            echo '::warning::未配置完整 macOS 公证凭证，将跳过公证。'
          fi

      - name: Build macOS Electron installer
        if: matrix.platform == 'macos'
        shell: bash
        env:
          APP_VERSION: ${{ inputs.version || github.ref_name }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./packaging/build-macos.sh "${{ matrix.arch }}"

      - name: Smoke test macOS package
        if: matrix.platform == 'macos'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          expected="${EXPECTED_VERSION#v}"
          dmg=$(ls artifacts/*.dmg | head -n 1)
          if [[ -z "$dmg" ]]; then echo '未找到 DMG 安装包'; exit 1; fi
          echo "安装包：$(basename "$dmg")"
          actual="$(node -p "require('./build/server-bundle/static/app-version.json').version")"
          if [[ "$actual" != "$expected" ]]; then
            echo "版本号不一致：期望 $expected，实际 $actual"
            exit 1
          fi
          spctl --assess --type execute --verbose "desktop/dist/mac/MeimeiWorkbench.app" 2>/dev/null && echo 'Gatekeeper 评估通过' || echo '未签名/未公证构建（预期行为）'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: meimei-workbench-${{ matrix.artifact }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create update manifest
        working-directory: release-assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: node "$GITHUB_WORKSPACE/packaging/create-update-manifest.mjs"

      - name: Prepare release notes
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -n "$WINDOWS_CERTIFICATE_BASE64" && -n "$WINDOWS_CERTIFICATE_PASSWORD" ]]; then
            windows_signing='已签名'
          else
            windows_signing='未签名（未配置证书）'
          fi
          if [[ -n "$APPLE_CERTIFICATE_P12_BASE64" && -n "$APPLE_CERTIFICATE_PASSWORD" && -n "$APPLE_SIGNING_IDENTITY" ]]; then
            macos_signing='已签名'
          else
            macos_signing='未签名（未配置证书）'
          fi
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            macos_notarization='已公证'
          else
            macos_notarization='未公证（未配置凭证）'
          fi
          cat > release-notes.md <<EOF
          本版本安装包已通过自动构建、版本号检查和 SHA-256 校验。

          安全状态：
          - Windows：${windows_signing}
          - macOS：${macos_signing}，${macos_notarization}

          未签名安装包仅建议在可信环境中测试使用。配置对应 GitHub Actions Secrets 后，后续标签发布会自动启用签名和 macOS 公证。
          EOF

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "美美大王工作台 $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat release-notes.md)"
