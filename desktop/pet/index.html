<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美美</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    #pet-container { position: relative; width: 100%; height: 100%; }
    #pet-canvas { position: absolute; bottom: 0; left: 0; image-rendering: pixelated; }
    #pet-bubble {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      max-width: 200px;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #pet-bubble.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="pet-container">
    <div id="pet-bubble"></div>
    <canvas id="pet-canvas"></canvas>
  </div>
  <script src="pet-renderer.js"></script>
</body>
</html>
